[project]
name = "thermo-line-reader"
version = "0.4.0"
description = "A tool for reading Thermo .raw files as lines and converting them to MSI images."
readme = "README.md"
authors = [
    { name = "Duncan McDougall", email = "duncan.mcdougall@rfi.ac.uk" }
]
requires-python = ">=3.13"
dependencies = [
    "pythonnet>=3.0.5",
    "xartus>=0.5.1",
    "argsui[gui]>=0.3.6",
    "pyimzml",
]
license = "LicenseRef-RFI-Apache-2.0-Commons-clause AND LicenseRef-RawFileReader-reading-tool"
license-files = ["LICENSES/*"]

[project.scripts]
main = "thermo_line_reader:source"

[build-system]
requires = ["uv_build>=0.10.0,<0.11.0"]
build-backend = "uv_build"

[tool.line_profiler.kernprof]
line-by-line = true
verbose = false
skip-zero = true
prof-mod = ['./src/thermo_line_reader/', 'thermo_line_reader', 'xartus']
prof-imports = false

[dependency-groups]
dev = [
    "pyinstaller>=6.19.0",
    "line-profiler>=5.0.1",
    "icecream>=2.1.10",
    "pre-commit>=4.7.0",
]

[tool.ruff.lint]
select=['E1', 'E4','E7','E9','F','N','ERA', 'ANN2', 'S', 'BLE', 'B', 'A', 'C4', 'COM', 'ISC', 'ICN', 'LOG', 'PIE','RET', 'SLF','SIM', 'TD', 'ARG', 'PTH', 'FLY', 'NPY', 'PERF', "D2", "TRY", "PT"]
ignore=["C408", "S311", "PTH123", "NPY002", "D203", "D205", "D212", "B006", "ARG001", "ARG002", "D200", "ANN204", "S101", "TRY003", 'RET504', 'COM812']
# From some modules: T20 -. Print   

[tool.ruff.lint.per-file-ignores]
"src/thermo_reader/load_thermo.py" = ["E402", "N802"]

[tool.bumpversion]
current_version = "0.4.0"
parse = "(?P<major>\\d+)\\.(?P<minor>\\d+)\\.(?P<patch>\\d+)"
serialize = ["{major}.{minor}.{patch}"]
search = "{current_version}"
replace = "{new_version}"
regex = false
ignore_missing_version = false
ignore_missing_files = false
tag = true
push_tag = false
sign_tags = false
tag_name = "v{new_version}"
tag_message = "Bump version: {current_version} -> {new_version}"
allow_dirty = false
commit = true
message = "Bump version to {new_version}: {distance_to_latest_tag} commits since {current_version}"
moveable_tags = []
commit_args = ''
setup_hooks = []
pre_commit_hooks = []
post_commit_hooks = []
allow_shell_hooks = false

[tool.typos.default.extend-identifiers]
fle = 'fle'
DNE = 'DNE'

[tool.typos.files]
extend-exclude = [
    "*/thermo_line_reader/dlls*",
    "*.spec"
    ]

[tool.uv.sources]
pyimzml = { git = "https://github.com/rosalindfranklininstitute/pyimzML.git" }
